<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ScoreVision - Student Performance Predictor</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>ScoreVision</h1>

            <p>
                Predict Performance. Discover Potential.
            </p>

            <p>
                Enter student details to predict academic performance
                using Machine Learning.
            </p>
        </div>


        <div class="card">

            <h2>Student Information</h2>

            <form action="/predict" method="POST">

                <div class="form-grid">

                    <!-- Student Name -->
                    <div class="form-group">
                        <label for="name">Student Name</label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Enter student name"
                            required
                        >
                    </div>


                    <!-- Age -->
                    <div class="form-group">
                        <label for="age">Age</label>

                        <input
                            type="number"
                            id="age"
                            name="age"
                            min="10"
                            max="100"
                            placeholder="Enter age"
                            required
                        >
                    </div>


                    <!-- Attendance -->
                    <div class="form-group">
                        <label for="attendance">
                            Attendance (%)
                        </label>

                        <input
                            type="number"
                            id="attendance"
                            name="attendance"
                            min="0"
                            max="100"
                            step="0.01"
                            placeholder="Example: 85"
                            required
                        >
                    </div>


                    <!-- Study Hours -->
                    <div class="form-group">
                        <label for="study_hours">
                            Study Hours per Day
                        </label>

                        <input
                            type="number"
                            id="study_hours"
                            name="study_hours"
                            min="0"
                            max="24"
                            step="0.1"
                            placeholder="Example: 4.5"
                            required
                        >
                    </div>


                    <!-- Previous Score -->
                    <div class="form-group">
                        <label for="previous_score">
                            Previous Exam Score
                        </label>

                        <input
                            type="number"
                            id="previous_score"
                            name="previous_score"
                            min="0"
                            max="100"
                            step="0.01"
                            placeholder="Example: 78"
                            required
                        >
                    </div>


                    <!-- Assignment Marks -->
                    <div class="form-group">
                        <label for="assignment_marks">
                            Assignment Marks
                        </label>

                        <input
                            type="number"
                            id="assignment_marks"
                            name="assignment_marks"
                            min="0"
                            max="100"
                            step="0.01"
                            placeholder="Example: 82"
                            required
                        >
                    </div>


                    <!-- Internal Marks -->
                    <div class="form-group">
                        <label for="internal_marks">
                            Internal Assessment Marks
                        </label>

                        <input
                            type="number"
                            id="internal_marks"
                            name="internal_marks"
                            min="0"
                            max="100"
                            step="0.01"
                            placeholder="Example: 80"
                            required
                        >
                    </div>


                    <!-- Participation -->
                    <div class="form-group">
                        <label for="participation">
                            Class Participation
                        </label>

                        <input
                            type="number"
                            id="participation"
                            name="participation"
                            min="0"
                            max="100"
                            step="0.01"
                            placeholder="Example: 75"
                            required
                        >
                    </div>


                    <!-- Sleep Hours -->
                    <div class="form-group">
                        <label for="sleep_hours">
                            Sleep Hours per Day
                        </label>

                        <input
                            type="number"
                            id="sleep_hours"
                            name="sleep_hours"
                            min="0"
                            max="24"
                            step="0.1"
                            placeholder="Example: 7"
                            required
                        >
                    </div>


                    <!-- Extracurricular -->
                    <div class="form-group">
                        <label for="extracurricular">
                            Extracurricular Activity
                        </label>

                        <select
                            id="extracurricular"
                            name="extracurricular"
                            required
                        >
                            <option value="1">Yes</option>
                            <option value="0">No</option>
                        </select>
                    </div>

                </div>


                <div class="button-container">

                    <button type="submit">
                        Predict Performance
                    </button>

                </div>

            </form>

        </div>

    </div>

</body>

</html>
